<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤖 3D Balance Robot — Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Inter', sans-serif; width: 100vw; height: 100vh; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }

        #mobileControls {
            position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px 20px; gap: 5px; z-index: 100;
        }
        #mobileControls input[type=range] {
            width: 100%; max-width: 400px; height: 6px; -webkit-appearance: none; appearance: none;
            background: rgba(255,255,255,0.15); border-radius: 3px; outline: none;
        }
        #mobileControls input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 30px; height: 30px;
            border-radius: 50%; background: #00f2fe; cursor: pointer; box-shadow: 0 0 10px #00f2fe;
        }
        #angleVal { color: #00f2fe; font-size: 14px; font-weight: bold; }
        
        #hud {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 12px 24px; border-radius: 12px;
            color: #00f2fe; font-size: 16px; font-weight: bold; z-index: 100; display: flex; gap: 30px;
            border: 1px solid rgba(0,242,254,0.3); box-shadow: 0 0 15px rgba(0,242,254,0.1);
        }
    </style>
</head>
<body>
    <div id="hud">
        <span id="hudScore">...</span>
        <span id="hudBotState">...</span>
    </div>
    
    <canvas id="mainGameCanvas"></canvas>
    
    <div id="mobileControls">
        <span id="angleVal">0°</span>
        <input type="range" id="angleSlider" min="-30" max="30" value="0" step="1">
    </div>

    <script>
        window.RehabGames = {};

        let simulatedAngle = 0;
        let game = null;
        
        const canvas = document.getElementById('mainGameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (game) game.resize(canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        const api = {
            updateHUD: (key, value) => {
                const el = document.getElementById(key);
                if (el) el.textContent = value;
            },
            updateCalibration: () => {}
        };

        const script = document.createElement('script');
        script.src = 'games/balance3d/game.js';
        script.onload = () => {
            game = new window.RehabGames['balance3d'](ctx, api);
            game.init(-30, 30);

            let lastTime = performance.now();
            function loop(time) {
                let dt = (time - lastTime) / 1000;
                lastTime = time;
                if (dt > 0.1) dt = 0.016;
                game.update(dt, simulatedAngle);
                game.draw();
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        };
        document.body.appendChild(script);

        const slider = document.getElementById('angleSlider');
        const angleLabel = document.getElementById('angleVal');
        
        slider.addEventListener('input', (e) => {
            simulatedAngle = parseFloat(e.target.value);
            angleLabel.textContent = simulatedAngle.toFixed(0) + '°';
        });

        // Arrow keys support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') simulatedAngle = Math.max(-30, simulatedAngle - 3);
            if (e.key === 'ArrowRight') simulatedAngle = Math.min(30, simulatedAngle + 3);
            slider.value = simulatedAngle;
            angleLabel.textContent = simulatedAngle.toFixed(0) + '°';
        });
        
        // Auto-reset when user lets go of slider (like a real spring)
        slider.addEventListener('change', () => {
            // Optional: simulate releasing the handle, or keep it.
        });
    </script>
</body>
</html>
